[project]
name = "lemoria"
version = "0.3.0"
description = "Memory OS and SDD orchestrator for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Cristian Lopez", email = "devcristianlopez@gmail.com" },
]
keywords = ["ai", "opencode", "sdd", "agents", "memory", "obsidian", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "sqlalchemy>=2.0",
    # SQLAlchemy 2.1 dropped psycopg2: the postgresql:// URL requires psycopg v3
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "gitpython>=3.1",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[project.urls]
Homepage = "https://github.com/devcristianlopez/lemoria"
Repository = "https://github.com/devcristianlopez/lemoria"
Issues = "https://github.com/devcristianlopez/lemoria/issues"
Documentation = "https://devcristianlopez.github.io/lemoria/"

[project.scripts]
lemoria = "lemoria.cli:cli"

[tool.setuptools.packages.find]
include = ["lemoria*", "database*"]

[tool.setuptools.package-data]
lemoria = ["omarchy_plugin/lemoria.usage/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["F811"]
